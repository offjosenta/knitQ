<!DOCTYPE html>
<html lang="ru" data-theme="liquid-silver">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KnitQ">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Автономный счетчик петель и органайзер проектов по вязанию для iPhone">
  
  <title>KnitQ</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
            <!-- Full-length crossed knitting needles behind the yarn ball -->
            <line x1="4" y1="4" x2="20" y2="20"></line>
            <circle cx="3.5" cy="3.5" r="1.2" fill="currentColor" stroke="none"></circle>
            <line x1="20" y1="4" x2="4" y2="20"></line>
            <circle cx="20.5" cy="3.5" r="1.2" fill="currentColor" stroke="none"></circle>
            <!-- Yarn ball masking the needle intersection -->
            <circle cx="12" cy="12.5" r="6" fill="var(--bg-card-main)" stroke="currentColor" stroke-width="1.65"></circle>
            <!-- Clean parallel yarn-wrap arcs -->
            <path d="M7.3 9.8c2.6-.7 5.8.4 8.2 2.7"></path>
            <path d="M6.4 12.6c3-.8 6.4.4 8.9 2.9"></path>
            <path d="M8.8 16.5c1.8-1.6 4.2-2.2 6.8-1.6"></path>
            <!-- Trailing yarn tail -->
            <path d="M16.2 16.8c1.4 1.2 2.8 1.2 4 .2"></path>
          </svg>
        </div>
        <h1 class="brand-title">KnitQ</h1>
      </div>

      <div class="header-actions">
        <!-- Settings Button -->
        <button id="btn-open-settings" class="btn-icon" aria-label="Настройки">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="app-main">
      <section class="glass-card">
        <h2 class="glass-card-title">Каркас приложения готов</h2>
        <p class="glass-card-desc">
          Полноэкранное автономное PWA-приложение для iPhone 15. Добавляется на экран «Домой», работает офлайн и поддерживает тёмную и светлую темы.
        </p>
        <div style="margin-top: 18px;">
          <button id="btn-quick-settings" class="btn-primary-action">
            Настройки и темы
          </button>
        </div>
      </section>
    </main>

    <!-- Settings Modal Sheet (Native iOS 15 grouped style) -->
    <div id="settings-modal" class="modal-backdrop">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 class="modal-title">Настройки</h3>
          <button id="btn-close-settings" class="modal-close-btn" aria-label="Закрыть">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- iOS 15 Grouped Section -->
        <div class="ios-grouped-section">
          <!-- Row 1: Wake Lock Toggle -->
          <div class="ios-row" id="row-wake-lock">
            <span class="ios-row-label">Не гасить экран при вязании</span>
            <div class="switch">
              <input type="checkbox" id="toggle-wake-lock" checked>
              <span class="slider"></span>
            </div>
          </div>

          <!-- Hairline Divider -->
          <div class="ios-divider"></div>

          <!-- Row 2: Theme Switcher (Moon & Sun only) -->
          <div class="ios-row" id="row-theme-toggle">
            <span class="ios-row-label">Тема оформления</span>
            <div id="theme-icon-toggle" class="theme-icon-toggle" role="button" aria-label="Переключить тему">
              <span class="theme-icon-opt moon-opt" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
              </span>
              <span class="theme-icon-opt sun-opt" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4"></circle>
                  <path d="M12 2v2"></path>
                  <path d="M12 20v2"></path>
                  <path d="m4.93 4.93 1.41 1.41"></path>
                  <path d="m17.66 17.66 1.41 1.41"></path>
                  <path d="M2 12h2"></path>
                  <path d="M20 12h2"></path>
                  <path d="m6.34 17.66-1.41 1.41"></path>
                  <path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
              </span>
              <div class="theme-toggle-knob">
                <span class="knob-icon moon-icon">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                  </svg>
                </span>
                <span class="knob-icon sun-icon">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="m4.93 4.93 1.41 1.41"></path>
                    <path d="m17.66 17.66 1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="m6.34 17.66-1.41 1.41"></path>
                    <path d="m19.07 4.93-1.41 1.41"></path>
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
